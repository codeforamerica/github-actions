name: Deploy to shared static hosting

on:
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy to.
        type: string
        required: false
        default: development
      source-dir:
        description: >-
          Local directory to sync, relative to the repository or artifact root.
        type: string
        required: false
        default: "."
      artifact-ids:
        description: >-
          Comma-separated list of artifact IDs to download. Use this when your
          application requires build steps. Artifact IDs are available as the
          `artifact-id` output of `actions/upload-artifact`. Takes precedence
          over artifact-name.
        type: string
        required: false
        default: ""
      artifact-name:
        description: >-
          Name of a previously uploaded artifact to deploy. An alternative to
          artifact-ids; prefer artifact-ids when the upload step ID is
          available.
        type: string
        required: false
        default: ""
      prefix:
        description: >-
          Prefix within the S3 bucket to sync files to. This should be the same
          as the application name. Defaults to `vars.STATIC_PREFIX` if not set.
        type: string
        required: false
        default: ""
    secrets:
      AWS_ROLE_ARN:
        description: IAM role ARN to assume for deployment.
        required: true

permissions:
  contents: read
  id-token: write

run-name: Deploy to ${{ inputs.environment }}

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        if: inputs.artifact-name == '' && inputs.artifact-ids == ''
        uses: actions/checkout@v7
      - name: Download build artifact
        if: inputs.artifact-ids != ''
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ inputs.artifact-ids }}
          path: ${{ inputs.source-dir }}
      - name: Download build artifact by name
        if: inputs.artifact-ids == '' && inputs.artifact-name != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.source-dir }}
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          role-session-name: github-${{ github.event.repository.name }}-${{ github.run_id }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: Sync to S3
        env:
          SOURCE_DIR: ${{ inputs.source-dir }}
          PREFIX: ${{ inputs.prefix || vars.STATIC_PREFIX }}
        run: |
          aws s3 sync "$SOURCE_DIR" \
            "s3://${{ vars.STATIC_BUCKET }}/$PREFIX" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*"
      - name: Invalidate CloudFront cache
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
      - name: Print deployment URL
        run: |
          PREFIX="${{ inputs.prefix || vars.STATIC_PREFIX }}"
          if [[ -n "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" ]]; then
            ALIAS=$(aws cloudfront get-distribution \
              --id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
              --query 'Distribution.DistributionConfig.Aliases.Items[0]' \
              --output text)
            DOMAIN="${ALIAS#\*.}"
            echo "Application deployed to https://${PREFIX}.${DOMAIN}/"
          else
            echo "Application deployed to https://${PREFIX}.${{ vars.STATIC_BUCKET }}/"
          fi
