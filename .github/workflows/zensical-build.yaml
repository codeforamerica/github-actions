name: Build documentation with Zensical

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing your Zensical configuration, relative to the
          repository root.
        type: string
        required: false
        default: "."
      site-dir:
        description: >-
          Directory Zensical writes the built site to, relative to
          working-directory. Must match `site_dir` in your configuration.
        type: string
        required: false
        default: site
      artifact-name:
        description: Name of the artifact to upload the built site as.
        type: string
        required: false
        default: documentation
    outputs:
      artifact-id:
        description: ID of the uploaded artifact containing the built site.
        value: ${{ jobs.build.outputs.artifact-id }}
      artifact-name:
        description: Name of the uploaded artifact containing the built site.
        value: ${{ inputs.artifact-name }}

permissions:
  contents: read

run-name: Build documentation with Zensical

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Check for a lockfile
        env:
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
        run: |
          if [[ ! -f uv.lock ]]; then
            echo "::error::No uv.lock found in '$WORKING_DIRECTORY'."
            exit 1
          fi
      - name: Build documentation
        # --locked fails if uv.lock is out of date with pyproject.toml.
        run: uv run --locked zensical build
      - name: Upload built site
        uses: actions/upload-artifact@v7
        id: upload
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.site-dir }}
          if-no-files-found: error
